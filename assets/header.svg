<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Michelle Vava, full-stack engineer in Halifax, Nova Scotia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121c"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.35"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.3"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.8,.2,1) forwards; }
    .fade { opacity: 0; animation: fade 0.8s ease-out forwards; }
    .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.7s; } .d3 { animation-delay: 1.1s; }
    .c1 { animation-delay: 1.4s; } .c2 { animation-delay: 1.55s; } .c3 { animation-delay: 1.7s; }
    .c4 { animation-delay: 1.85s; } .c5 { animation-delay: 2.0s; }
    .floatA { animation: floatA 9s ease-in-out infinite; }
    .floatB { animation: floatB 11s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .sweep { animation: sweep 4s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,30px); } }
    @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-20px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { 0%,100% { transform: translateX(-260px); } 50% { transform: translateX(260px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle class="floatA" cx="180" cy="80" r="260" fill="url(#orbA)"/>
    <circle class="floatB" cx="1040" cy="280" r="280" fill="url(#orbB)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text class="mono fade d1" x="600" y="70" text-anchor="middle" font-size="16" letter-spacing="4" fill="#5eead4">HI, I'M</text>

  <text class="sans rise d1" x="600" y="160" text-anchor="middle" font-size="88" font-weight="800" letter-spacing="-1" fill="url(#shine)">Michelle Vava</text>

  <g class="fade d2">
    <rect x="390" y="182" width="420" height="2" fill="url(#line)" class="sweep"/>
  </g>

  <text class="sans fade d2" x="600" y="218" text-anchor="middle" font-size="22" fill="#cbd5e1">Full-stack engineer · Halifax, Nova Scotia</text>

  <text class="mono fade d3" x="600" y="256" text-anchor="middle" font-size="17" fill="#94a3b8">I replace complex spreadsheets with software people trust<tspan class="cursor" fill="#2dd4bf">▌</tspan></text>

  <g class="sans" font-size="14" font-weight="600" text-anchor="middle">
    <g class="fade c1"><rect x="331" y="282" width="98" height="30" rx="15" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.5"/><text x="380" y="302" fill="#5eead4">C# / .NET</text></g>
    <g class="fade c2"><rect x="439" y="282" width="80" height="30" rx="15" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.5"/><text x="479" y="302" fill="#93c5fd">React</text></g>
    <g class="fade c3"><rect x="529" y="282" width="112" height="30" rx="15" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.5"/><text x="585" y="302" fill="#5eead4">TypeScript</text></g>
    <g class="fade c4"><rect x="651" y="282" width="80" height="30" rx="15" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.5"/><text x="691" y="302" fill="#93c5fd">Azure</text></g>
    <g class="fade c5"><rect x="741" y="282" width="128" height="30" rx="15" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.5"/><text x="805" y="302" fill="#5eead4">React Native</text></g>
  </g>
</svg>
