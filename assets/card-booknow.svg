<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img" aria-label="BookNow: Same-day booking for local services in Halifax: find an open slot, book instantly.">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="560" height="210" rx="18"/></clipPath>
  </defs>
  <style>
    .pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .in { opacity: 0; animation: in 0.7s ease-out 0.1s forwards; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="560" height="210" fill="#0d1117"/>
    <rect width="560" height="210" fill="url(#glow)"/>
    <rect width="560" height="4" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="559" height="209" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <g class="in" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <rect x="28" y="30" width="44" height="44" rx="12" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="50" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#3b82f6">B</text>
    <text x="86" y="62" font-size="26" font-weight="700" fill="#f1f5f9">BookNow</text>

    <rect x="441" y="34" width="95" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.45"/>
    <circle class="pulse" cx="456" cy="47" r="4" fill="#fbbf24"/>
    <circle cx="456" cy="47" r="4" fill="#fbbf24"/>
    <text x="467" y="52" font-size="13" font-weight="600" fill="#fbbf24">Building</text>

    <text x="28" y="110" font-size="16" fill="#94a3b8">Same-day booking for local services in</text>
    <text x="28" y="134" font-size="16" fill="#94a3b8">Halifax: find an open slot, book instantly.</text>
    <rect x="28" y="156" width="61" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="58.5" y="175" text-anchor="middle" font-size="13" fill="#cbd5e1">React</text>
    <rect x="97" y="156" width="54" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="124" y="175" text-anchor="middle" font-size="13" fill="#cbd5e1">Expo</text>
    <rect x="159" y="156" width="113" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="215.5" y="175" text-anchor="middle" font-size="13" fill="#cbd5e1">React Native</text>
    <rect x="280" y="156" width="76" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="318" y="175" text-anchor="middle" font-size="13" fill="#cbd5e1">Leaflet</text>
    <path d="M512 170h18m-6-6l6 6-6 6" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
